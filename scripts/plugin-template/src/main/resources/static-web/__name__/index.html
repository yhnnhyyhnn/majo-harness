<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__name__ plugin</title>
    <style>
      :root { color-scheme: dark; }
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #10141c; color: #e8ecf3; padding: 24px; }
      h1 { font-size: 18px; color: #5b93ff; }
      .card { background: #1e2430; border: 1px solid #2a3242; border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
      button { background: #2f63c9; border: none; color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
      .meta { color: #97a1b3; }
    </style>
  </head>
  <body>
    <h1>▶ __name__ plugin</h1>
    <p class="meta">Hosted page served from the plugin jar (static-web/__name__/).</p>
    <div class="card">
      <strong>Harness info:</strong>
      <pre id="out">loading…</pre>
    </div>
    <button id="refresh" type="button">refresh</button>
    <script src="app.js"></script>
  </body>
</html>
