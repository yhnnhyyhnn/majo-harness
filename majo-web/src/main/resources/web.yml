# majo web profile (M5: web UI, dsh-style)
#
# Same all-plugin tree as headless, plus the session-title seam used by the
# sidebar. The model defaults to the offline mock; copy this file and swap the
# llm row to point at your own endpoint (see README "Bring your own model").
- id: session
  name: session
  config:
    store: memory
- id: session-projections
  name: session-projections
- id: tools
  name: tools
- id: llm
  name: llm
  config:
    defaultModel: mock
- id: llm-mock
  name: llm-mock
- id: agent-loop
  name: agent-loop
  config:
    systemPrompt: "You are a helpful agent harness. Use the calc tool whenever asked for arithmetic."
    maxSteps: 6
- id: session-title
  name: session-title
- id: session-title-heuristic
  name: session-title-heuristic
- id: calc
  name: calc
