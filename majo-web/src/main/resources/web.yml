# majo web profile (dsh-style chat UI)
#
# Two models are offered by the picker: `mock` (offline, default) and the kilo
# free tier via the OpenAI-compatible gateway (no API key required). The
# choice is persisted in ctx.settings (settings.web.model).
- id: session
  name: session
  config:
    store: memory
- id: session-projections
  name: session-projections
- id: tools
  name: tools
- id: settings
  name: settings
- id: llm
  name: llm
  config:
    defaultModel: mock
- id: llm-mock
  name: llm-mock
- id: llm-openai
  name: llm-openai
  config:
    name: kilo-free
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    baseUrl: https://api.kilo.ai/api/gateway
- id: agent-loop
  name: agent-loop
  config:
    systemPrompt: "You are a helpful agent harness. Use the calc tool whenever asked for arithmetic."
    maxSteps: 6
- id: session-title
  name: session-title
- id: session-title-heuristic
  name: session-title-heuristic
- id: interactions
  name: interactions
  config:
    approval: deny
- id: tool-approval
  name: tool-approval
  config:
    tools: [calc]
- id: skills
  name: skills
- id: skill-files
  name: skill-files
  config:
    path: skills   # repo-relative (run from repo root)
- id: skill-tools
  name: skill-tools
- id: subagent
  name: subagent
  config:
    maxDepth: 3
- id: subagent-tools
  name: subagent-tools
- id: web
  name: web
- id: web-search-wiki
  name: web-search-wiki
  config:
    lang: en
- id: web-fetch-http
  name: web-fetch-http
- id: calc
  name: calc
