# majo web profile (dsh-style chat UI)
#
# Model: kilo free tier via the OpenAI-compatible gateway. Set the key once:
#   export KILO_API_KEY=...        (Windows: setx KILO_API_KEY ...)
# The ${...} reference is expanded from the environment at boot; an unset
# variable fails loudly instead of sending a placeholder.
- id: session
  name: session
  config:
    store: memory
- id: session-projections
  name: session-projections
- id: tools
  name: tools
- id: llm
  name: llm
  config:
    defaultModel: kilo-free
- id: llm-openai
  name: llm-openai
  config:
    name: kilo-free
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    baseUrl: https://api.kilo.ai/api/gateway
    apiKey: ${KILO_API_KEY}
- id: agent-loop
  name: agent-loop
  config:
    systemPrompt: "You are a helpful agent harness. Use the calc tool whenever asked for arithmetic."
    maxSteps: 6
- id: session-title
  name: session-title
- id: session-title-heuristic
  name: session-title-heuristic
- id: calc
  name: calc
