<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>majo harness</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<aside id="sidebar">
  <header class="brand"><strong>majo</strong><span>harness</span></header>
  <button id="new-chat" type="button">+ New chat</button>
  <nav id="session-list" aria-label="sessions"></nav>
</aside>
<main>
  <header id="chat-header">
    <span id="current-title">—</span>
    <span id="model-badge" class="badge">model: mock</span>
  </header>
  <ol id="conversation" aria-live="polite"></ol>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Type a task… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div id="busy" hidden>running…</div>
</main>
<script src="/app.js"></script>
</body>
</html>
