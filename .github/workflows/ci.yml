name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 24 (web-ui build)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install bubblewrap (Linux sandbox test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      # jcordis (io.github.yhnnhyyhnn:jcordis-core/-loader:1.0.1) now comes
      # straight from Maven Central — no vendoring step needed.

      - name: Build and test (mvn clean verify incl. web-ui)
        run: mvn -B -ntp clean verify

      - name: Frontend unit tests (vitest)
        run: npx vitest run
        working-directory: web-ui

      - name: Build the plugin demo jar (best effort)
        run: |
          if bash scripts/build-plugin-demo.sh; then
            echo "plugin demo jar built"
          else
            echo "::warning::plugin demo skipped (jcordis-all not available in the local repo)"
          fi
