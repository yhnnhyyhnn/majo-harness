name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 24 (web-ui build)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # jcordis-all is not published to Maven Central; install the vendored
      # parent pom + fat jar (lib/) into the local repo first.
      - name: Install vendored jcordis artifacts
        run: |
          ls -la lib
          mvn -ntp org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -Dfile="$PWD/lib/jcordis-parent-1.0.0.pom" -DgroupId=io.jcordis -DartifactId=jcordis-parent -Dversion=1.0.0 -Dpackaging=pom
          mvn -ntp org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -Dfile="$PWD/lib/jcordis-all-1.0.0.jar" -DgroupId=io.jcordis -DartifactId=jcordis-all -Dversion=1.0.0 -Dpackaging=jar -DgeneratePom=true

      - name: Build and test (mvn clean verify incl. web-ui)
        run: mvn -B -ntp clean verify

      - name: Frontend unit tests (vitest)
        run: npx vitest run
        working-directory: web-ui

      - name: Build the plugin demo jar (best effort)
        run: |
          if bash scripts/build-plugin-demo.sh; then
            echo "plugin demo jar built"
          else
            echo "::warning::plugin demo skipped (jcordis-all not available in the local repo)"
          fi
