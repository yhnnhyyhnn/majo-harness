name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 24 (web-ui build)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install bubblewrap (Linux sandbox test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      # repo invariants enforced locally by scripts/check.sh — the same gates,
      # so a green local run predicts a green CI run
      - name: Gate: service code logs via slf4j (no stdout)
        run: bash scripts/verify-no-stdout.sh

      - name: Gate: frontend lint (ESLint)
        run: npx eslint src
        working-directory: web-ui

      # jcordis (io.github.yhnnhyyhnn:jcordis-core/-loader:1.0.1) now comes
      # straight from Maven Central — no vendoring step needed.

      - name: Build and test (mvn clean verify incl. web-ui + ToolCatalog drift)
        run: mvn -B -ntp clean verify

      - name: Frontend unit tests (vitest)
        run: npx vitest run
        working-directory: web-ui

      - name: Live DuckDuckGo probe (best effort, needs outbound network)
        continue-on-error: true
        env:
          MAJO_NET_PROBE: "1"
        run: mvn -B -ntp -pl majo-web-access -am test -Dtest=DdgLiveProbeTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Live MCP probes (best effort, needs outbound network + node)
        continue-on-error: true
        env:
          MAJO_MCP_PROBE: "1"
        run: mvn -B -ntp -pl majo-mcp -am test -Dtest='McpFilesystemLiveProbeTest,McpRemoteLiveProbeTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Build the plugin demo jar (best effort)
        run: |
          if bash scripts/build-plugin-demo.sh; then
            echo "plugin demo jar built"
          else
            echo "::warning::plugin demo skipped (jcordis-all not available in the local repo)"
          fi
